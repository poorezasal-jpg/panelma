<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل دستیار کافی‌نت | motionmmd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #070b14;
      --bg-surface: rgba(15, 23, 42, 0.72);
      --bg-card: rgba(22, 32, 56, 0.65);
      --bg-card-hover: rgba(30, 44, 75, 0.9);
      --border-glass: rgba(148, 163, 184, 0.14);
      --border-glow: rgba(56, 189, 248, 0.45);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --badge-temp: #f59e0b;
      --badge-temp-bg: rgba(245, 158, 11, 0.14);
      --badge-price: #10b981;
      --badge-price-bg: rgba(16, 185, 129, 0.14);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.12) 0%, transparent 38%),
        radial-gradient(circle at 85% 20%, rgba(129, 140, 248, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(14, 165, 233, 0.08) 0%, transparent 45%);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Top Sticky Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 11, 20, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-glass);
      padding: 14px 24px;
    }

    .topbar-inner {
      max-width: 1480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--accent-glow);
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff, #38bdf8, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: system-ui, -apple-system, sans-serif;
      direction: ltr;
      text-align: right;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Search Bar */
    .search-box {
      flex: 1;
      max-width: 520px;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 10px 42px 10px 16px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
    }

    .search-box svg {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-shortcut {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(255,255,255,0.06);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid var(--border-glass);
      pointer-events: none;
    }

    .stats-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 7px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-glass);
    }

    .stats-pill strong {
      color: var(--accent);
      font-weight: 700;
    }

    /* Layout */
    .layout {
      max-width: 1480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
      padding: 24px;
      align-items: start;
    }

    /* Sidebar */
    .sidebar {
      position: sticky;
      top: 86px;
      background: var(--bg-surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 14px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }

    .sidebar::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 10px;
    }

    .sidebar-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 10px 10px;
      border-bottom: 1px solid var(--border-glass);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .cat-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .cat-nav button {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: right;
      transition: all 0.15s ease;
    }

    .cat-nav button:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .cat-nav button.active {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.35);
      color: var(--accent);
      font-weight: 600;
    }

    .cat-count {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.07);
      padding: 1px 7px;
      border-radius: 99px;
      color: var(--text-muted);
    }

    .cat-nav button.active .cat-count {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
    }

    /* Main Content */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 28px;
      min-width: 0;
    }

    .section-card {
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .section-card.is-temp {
      border-color: rgba(245, 158, 11, 0.3);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.05) 0%, var(--bg-surface) 100%);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-glass);
      flex-wrap: wrap;
      gap: 8px;
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .is-temp .section-dot {
      background: var(--badge-temp);
      box-shadow: 0 0 10px var(--badge-temp);
    }

    .section-header h2 {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .section-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .section-badge {
      font-size: 0.76rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 3px 10px;
      border-radius: 99px;
    }

    .is-temp .section-badge {
      color: var(--badge-temp);
      background: var(--badge-temp-bg);
      border-color: rgba(245, 158, 11, 0.3);
    }

    /* Service Grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
    }

    .service-item {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      position: relative;
    }

    .service-item:hover {
      transform: translateY(-2px);
      background: var(--bg-card-hover);
      border-color: var(--border-glow);
      box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.6), 0 0 12px rgba(56, 189, 248, 0.12);
    }

    .service-link {
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      line-height: 1.5;
    }

    .service-link:hover {
      color: var(--accent);
    }

    .ext-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-top: 3px;
      opacity: 0.55;
      transition: opacity 0.15s, transform 0.15s;
    }

    .service-item:hover .ext-icon {
      opacity: 1;
      color: var(--accent);
      transform: translate(-2px, -2px);
    }

    .service-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .meta-tags {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .tag-deadline {
      font-size: 0.7rem;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.28);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .tag-price {
      font-size: 0.7rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.28);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .info-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      border-radius: 7px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
      margin-right: auto;
    }

    .info-btn:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent);
      color: #fff;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.78);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 18px;
      max-width: 560px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      animation: popIn 0.18s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }

    .modal-header h3 {
      font-size: 1.05rem;
      color: var(--text-main);
    }

    .modal-close {
      background: rgba(255,255,255,0.07);
      border: none;
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .modal-body {
      font-size: 0.88rem;
      color: #cbd5e1;
      white-space: pre-line;
      max-height: 55vh;
      overflow-y: auto;
      line-height: 1.75;
    }

    .modal-footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border-glass);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-glass);
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        padding: 14px;
      }
      .sidebar {
        position: static;
        max-height: none;
      }
      .cat-nav {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .cat-nav button {
        width: auto;
      }
    }
  </style>
</head>

ه ( NRC.ir )", "url": "https://ncr.ir/", "price": "", "deadline": "", "info": "سامانه ncr.ir مربوط به سازمان ثبت احوال کشور است و یکی از خدمات آن، جداسازی یارانه از خانوار است.\r\n\r\nاین فرایند برای افرادی طراحی شده که به‌صورت مستقل زندگی می‌کنند و می‌خواهند یارانه‌شان از حساب سرپرست خانوار جدا شود تا مستقیماً به حساب خودشان واریز گردد.\r\n\r\nنحوه انجام کار:\r\n\r\nورود به سامانه ثبت احوال و انتخاب گزینه جداسازی یارانه.\r\n\r\nوارد کردن اطلاعات هویتی (کد ملی، شماره شناسنامه و شماره حساب بانکی به نام شخص).\r\n\r\nتأیید شرایط مانند سن بالای ۱۸ سال و داشتن محل سکونت مستقل.\r\n\r\nبررسی اطلاعات توسط سامانه رفاه و سازمان هدفمندی یارانه‌ها.\r\n\r\nدر صورت تأیید، فرد به‌عنوان یک خانوار جدید ثبت می‌شود و از ماه بعد یارانه به حساب خودش واریز می‌گردد.\r\n\r\nاین خدمت برای کاهش وابستگی یارانه افراد به سرپرست خانوار و شفاف‌سازی پرداخت‌ها ایجاد شده است."}, {"id": "shared-400", "title": "درگاه خدمات دولت", "url": "https://my.gov.ir/", "price": "", "deadline": "", "info": "سامانه my.gov.ir درگاه مرکزی دولت ایران برای ارائه خدمات الکترونیکی به شهروندان است. با استفاده از این سامانه، کاربران می‌توانند با ثبت‌نام و ورود از طریق شماره موبایل، به یک حساب کاربری واحد دسترسی پیدا کنند. پس از ورود و احراز هویت، امکان مشاهده، ثبت، پیگیری و مدیریت انواع خدمات دولتی مثل آموزش، سلامت، مسکن، مالیات، یارانه و … فراهم می‌شود. این سامانه زمان و هزینه مراجعه حضوری را کاهش می‌دهد و روند خدمات دولتی را یکپارچه و ساده می‌سازد."}, {"id": "shared-399", "title": "خدمات ایثارگران", "url": "https://my.isaar.ir/", "price": "", "deadline": "", "info": "کاربردها\r\n\r\nامکان استعلام وضعیت ایثارگری یا وابستگی به ایثارگران از طریق وارد کردن کد ملی. \r\n\r\nمشاهده فیش حقوقی، مستمری و وضعیت حقوق و معیشت ایثارگران و جانبازان. \r\n\r\nثبت درخواست کارت ایثارگری، صدور المثنی یا اصلاحی کارت. \r\n\r\nارائه تسهیلات رفاهی و مالی شامل وام، مسکن، بیمه‌های مکمل و تخفیفات ویژه. \r\n\r\nپیگیری درخواست‌ها، استعلام‌ها و انجام خدمات به‌صورت کاملاً آنلاین بدون نیاز به مراجعه حضوری. \r\n\r\n\r\nچگونه از آن استفاده کنیم\r\n\r\n1. وارد سایت شده و با شماره موبایل و کد ملی ثبت‌نام می‌کنید. \r\n\r\n\r\n2. پس از ورود، منوی خدمات را باز کرده و خدمت مورد نظر را انتخاب می‌کنید (مثلاً «استعلام ایثارگر»، «کارت ایثارگری»، «فیش حقوقی»).\r\n\r\n\r\n3. اطلاعات هویتی خواسته‌شده را وارد کرده و درخواست خود را ثبت می‌کنید.\r\n\r\n\r\n4. نتیجه درخواست (مثلاً کد ایثارگری یا وضعیت کارت) در سامانه نمایش داده می‌شود و امکان دانلود یا چاپ آن وجود دارد.\r\n\r\n\r\n5. در صورت نیاز می‌توانید وضعیت درخواست‌ها را پیگیری یا مراجعه بعدی انجام دهید.\r\n\r\n\r\n\r\nاگر بخوای، می‌تونم جدیدترین خدمات اضافه‌شده این سامانه رو برات پیدا کنم و بفرستم تا کامل باشی."}, {"id": "shared-398", "title": "بازنشستگان کشوری", "url": "https://eservices.cspf.ir/Auth-api/", "price": "۳۵.۰۰۰", "deadline": "", "info": "اما بر اساس سایت اصلی درگاه خدمات الکترونیکی صندوق بازنشستگی کشوری، این خدمات عمدتاً پوشش می‌دهند:\r\n\r\nدریافت فیش حقوقی\r\n\r\nدریافت حکم حقوق\r\n\r\nخدمات بیمه تکمیلی\r\n\r\nدرخواست وام ضروری\r\n\r\nثبت‌نام کاربران\r\n\r\nمدیریت حساب کاربری و احراز هویت\r\n\r\nتغییر اطلاعات شخصی\r\n\r\nخدمات رفاهی ویژه بازنشستگان\r\n\r\nاستعلامات داخلی مرتبط با صندوق"}, {"id": "shared-280", "title": "سنجش", "url": "https://sanjesh.org/", "price": "", "deadline": "", "info": "«سامانه سنجش» معمولاً به سازمان سنجش آموزش کشور اشاره دارد که مسئول برگزاری امتحان‌ها، کنکورها و سایر آزمون‌های ملی است.\r\n\r\nعملکرد و خدمات سامانه سنجش (سازمان سنجش):\r\n\r\nثبت‌نام آزمون‌های سراسری، کارشناسی ارشد، دکتری و سایر مقاطع\r\n\r\nانتشار دفترچه راهنما و شرایط آزمون\r\n\r\nارائه کارت ورود به جلسه\r\n\r\nاعلام نتایج اولیه و نهایی\r\n\r\nخدمات پاسخگویی به داوطلبان\r\n\r\nبخش «مای سنجش» که پنل شخصی داوطلبان برای مدیریت اطلاعات، مشاهده نتایج و خدمات مرتبط است"}, {"id": "shared-275", "title": "خدمات ثبت احوال", "url": "https://sahim.sabteahval.ir/", "price": "", "deadline": "", "info": "پایگاه اطلاعات خانواده (شجره‌نامه و روابط خانوادگی)\r\n\r\nثبت‌نام و پیگیری کارت ملی هوشمند\r\n\r\nتغییر نشانی و به‌روزرسانی آدرس محل سکونت\r\n\r\nصدور شناسنامه نوزاد\r\n\r\nانتخاب یا تغییر نام و نام‌خانوادگی\r\n\r\nصدور گواهی تجرد\r\n\r\nثبت و پیگیری انحصار وراثت الکترونیکی\r\n\r\nپیگیری درخواست‌ها\r\n\r\nصدور پروانه ارائه خدمات ثبت احوال (ویژه اشخاص حقوقی)\r\n\r\nصدور گواهی‌نامه مدیر فنی دفاتر پیشخوان"}, {"id": "shared-246", "title": "عدل ایران", "url": "https://adliran.ir/", "price": "۳۵.۰۰۰", "deadline": "", "info": "ابلاغیه / عدم سوء پیشینه / نوبت دهی دفاتر قضایی و سایر خدمات قضایی در این سامانه صورت میگیرد"}, {"id": "shared-113", "title": "سامانه مسیر", "url": "https://masir.23055.ir/login", "price": "۱۳۰.۰۰۰", "deadline": "", "info": "نوبت دهی مشاوره طلاق\r\n«سامانه مسیر» یک سامانه رسمی برای نوبت‌دهی و مشاوره پیش از طلاق است.\r\n\r\nکارکردش اینه که هر زوجی که قصد طلاق دارند، باید ابتدا در این سامانه ثبت‌نام کنند و مراحل مشاوره اجباری را بگذرانند، قبل از اینکه پرونده به دادگاه بره.\r\n\r\nدر این سامانه:\r\n\r\nکاربر با وارد کردن کد ملی و شماره تماس، درخواست خودش را ثبت می‌کند.\r\n\r\nنوع درخواست (طلاق توافقی یا یک‌طرفه) مشخص می‌شود.\r\n\r\nنوبت جلسات مشاوره حضوری یا تلفنی تعیین می‌شود.\r\n\r\nهزینه مشاوره پرداخت می‌شود.\r\n\r\nبعد از پایان جلسات، نتیجه‌ی مشاوره و مجوز مراجعه به دادگاه صادر می‌شود.\r\n\r\nسامانه مسیر برای هماهنگی بین مردم، مراکز مشاوره و دستگاه قضایی طراحی شده تا طلاق‌ها بدون بررسی و مشاوره سریع انجام نشوند.\r\nآدرس رسمی سامانه معمولاً به صورت masir.23055.ir است."}, {"id": "shared-53", "title": "مرات", "url": "https://newmerat.ir/#/auth/login", "price": "۳۰۰.۰۰۰", "deadline": "", "info": "سامانه «مرآت» (مخفف مرکز ارزیابی توانمندی مالی متقاضیان) یکی از زیرسامانه‌های بانک مرکزی جمهوری اسلامی ایران است که برای اعتبارسنجی افراد و شرکت‌ها در هنگام درخواست تسهیلات بانکی به کار می‌رود.\r\n( اعتبار سنجی بانک رسالت )\r\n\r\nکاربردها:\r\n\r\nبررسی و امتیازدهی اعتباری متقاضیان وام در بانک‌ها.\r\n\r\nاستعلام وضعیت بدهی، چک برگشتی و سوابق بانکی.\r\n\r\nمحاسبه توان بازپرداخت تسهیلات قبل از صدور وام.\r\n\r\nاستفاده بانک‌ها و مؤسسات اعتباری برای ارزیابی ریسک مشتریان.\r\n\r\n\r\nنحوه کار:\r\n\r\n1. متقاضی وام یا شرکت، اطلاعات خود را در ir می‌شود.\r\n\r\nدر بخش «استعلامات بانکی و مالی»، نوع خدمت مورد نظر (مانند استعلام حساب‌ها، تسهیلات یا چک‌ها) را انتخاب می‌کند.\r\n\r\nپس از وارد کردن اطلاعات لازم، سامانه جزئیات مربوط را نمایش می‌دهد؛ از جمله تعداد حساب‌ها، بانک‌ها، میزان تسهیلات یا چک‌های برگشتی.\r\n\r\nکاربر می‌تواند نتیجه را ذخیره یا چاپ کند و در صورت وجود مغایرت، با بانک صادرکننده یا نهاد مربوطه تماس بگیرد.\r\n\r\nاین سامانه برای افزایش شفافیت بانکی و دسترسی ساده مردم به اطلاعات مالی خود ایجاد شده است."}, {"id": "shared-312", "title": "اعتبارات اسنادی ریالی", "url": "https://zemanat.bsi.ir/", "price": "۳۵.۰۰۰", "deadline": "", "info": "سامانه «ضمانت‌نامه بانکی – سامانه بانک مرکزی» معرفی‌ شده است، برای صدور، ثبت، نظارت و استعلام ضمانت‌نامه‌های بانکی به صورت الکترونیکی در بستر بانک‌ها و مراکز اقتصادی ایران.\r\n\r\nکاربردها:\r\n\r\nثبت اطلاعات ضمانت‌نامه بانکی توسط بانک یا مؤسسه مالی: متقاضی ضمانت، ذی‌نفع، مبلغ، مدت‌زمان، موضوع ضمانت و بانک صادرکننده.\r\n\r\nاستعلام وضعیت ضمانت‌نامه: فعال، منقضی، ابطال‌شده یا تعلیق‌شده.\r\n\r\nاصالت‌سنجی ضمانت‌نامه برای ذی‌نفع یا طرف قرارداد؛ کاهش ریسک ضمانت‌نامه‌های جعلی یا فاقد ثبت رسمی.\r\n\r\nکنترل متمرکز صدور ضمانت‌نامه‌ها توسط بانک مرکزی جمهوری اسلامی ایران و جلوگیری از تخلفات بازار بانکی در فرآیند تضمین تعهدات مالی.\r\n\r\nشیوه کار:\r\n\r\nبانک یا مؤسسه مالی متقاضی ضمانت‌نامه وارد سامانه می‌شود و اطلاعات کامل درخواست را ثبت می‌کند.\r\n\r\nپس از تأیید توسط بانک صادرکننده و تطبیق با مقررات بانک مرکزی، ضمانت‌نامه صادر شده و کد یکتای آن به ذی‌نفع ابلاغ می‌گردد.\r\n\r\nذی‌نفع می‌تواند با استفاده از شماره ضمانت یا کد یکتا وارد سامانه شود و «وضعیت ضمانت‌نامه» را استعلام کند.\r\n\r\nدر صورت هرگونه تغییر وضعیت (تمدید، انتقال، ابطال) این تغییرات در سامانه ثبت می‌شود و برای طرفین قابل مشاهده می‌گردد."}, {"id": "shared-311", "title": "ضمانت نامه ریالی", "url": "https://rialwarranty.bsi.ir/", "price": "۳۵.۰۰۰", "deadline": "", "info": "سامانه «ضمانت‌نامه ریالی» زیر نظر بانک مرکزی جمهوری اسلامی ایران به آدرس rialwarranty.bsi.ir خدمت الکترونیکی است که برای صدور، ثبت، پیگیری و استعلام ضمانت‌نامه‌های بانکی ریالی طراحی شده است.\r\n\r\nکاربردها:\r\n\r\nثبت آنلاین درخواست صدور ضمانت‌نامه ریالی توسط واحدهای اقتصادی، شرکت‌ها و بانک‌ها.\r\n\r\nپیگیری وضعیت ضمانت‌نامه صادرشده: فعال، منقضی، باطل‌شده یا تعلیق‌شده.\r\n\r\nاستعلام اصالت ضمانت‌نامه توسط ذی‌نفع یا بانک مربوطه با وارد کردن شماره ضمانت‌نامه یا کد یکتا.\r\n\r\nکاهش مراجعات حضوری، جلوگیری از صدور ضمانت‌نامه جعلی و شفاف‌سازی نظام ضمانت بانکی.\r\n\r\nشیوه کار:\r\n\r\nمتقاضی (بانک یا شرکت) وارد سامانه می‌شود و با استفاده از حساب کاربری یا دسترسی ویژه ثبت‌نام می‌کند.\r\n\r\nاطلاعات مربوط به متقاضی، مبلغ، مدت ضمانت‌نامه، نوع تعهد، بانک ذی‌نفع و سایر مشخصات وارد می‌شود.\r\n\r\nپس از تأیید اولیه بانک و سامانه، ضمانت‌نامه صادر و به متقاضی ابلاغ می‌گردد.\r\n\r\nهر زمان ذی‌نفع یا بانک نیاز داشت، وارد بخش «استعلام اصالت» می‌شود، شماره ضمانت‌نامه را وارد می‌کند و وضعیت آن را مشاهده می‌کند.\r\n\r\nدر صورت بروز تغییر (مثلاً تمدید یا ابطال)، سیستم بانک مرکزی بلافاصله وضعیت را به‌روزرسانی می‌کند و ذی‌نفع از طریق سامانه قادر به مشاهده خواهد بود."}, {"id": "shared-277", "title": "کارت هوشمند رانندگان", "url": "https://smartcard.rmto.ir/tto/f?p=301:1:2796743770264", "price": "۳۵.۰۰۰", "deadline": "", "info": "سامانه کارت هوشمند رانندگان زیر نظر سازمان راهداری و حمل‌ونقل جاده‌ای فعالیت می‌کند و برای صدور، تمدید و استعلام کارت رانندگان حرفه‌ای حمل‌ونقل بین‌ شهری بار و مسافر به کار می‌رود.\r\n\r\nاین کارت نشان می‌دهد راننده دارای صلاحیت قانونی، مدارک لازم و سلامت شغلی تأییدشده است و بدون آن فعالیت در ناوگان رسمی کشور مجاز نیست.\r\n\r\nکاربردهای اصلی:\r\n\r\nثبت و کنترل اطلاعات رانندگان حرفه‌ای در حمل‌ونقل بین‌شهری.\r\n\r\nصدور مجوز رسمی برای دریافت بارنامه یا سرویس مسافری.\r\n\r\nاستعلام وضعیت گواهینامه، سلامت، بیمه و سوابق راننده توسط شرکت‌ها و پلیس راه.\r\n\r\nجلوگیری از فعالیت رانندگان فاقد مجوز معتبر.\r\n\r\nنحوه دریافت یا تمدید کارت:\r\n\r\nمراجعه راننده به یکی از مراکز صدور کارت هوشمند با مدارک هویتی، گواهینامه، کارت سلامت و عکس.\r\n\r\nثبت اطلاعات در سامانه راهداری و ارسال برای تأیید.\r\n\r\nپس از ‌دیدگی ورزشی.\r\n\r\nمشاهده راهنما و دستورالعمل دریافت خدمات درمانی.\r\n\r\nارتباط با سامانه بیمه ورزشی (برای صدور و استعلام بیمه ورزشکار).\r\n\r\nمشاهده و ویرایش اطلاعات شخصی و سوابق درمانی.\r\n\r\nویژگی‌های فنی:\r\n\r\nسامانه به‌صورت تک‌صفحه‌ای (SPA) طراحی شده و برای اجرا نیاز به فعال بودن JavaScript دارد.\r\n\r\nبدون فعال بودن جاوااسکریپت، فقط پیغام «You need to enable JavaScript to run this app.» نمایش داده می‌شود.\r\n\r\nمعمولاً از طریق مرورگرهای دسکتاپ و موبایل قابل دسترسی است.\r\n\r\nبه‌طور خلاصه، این سامانه مخصوص ثبت، مدیریت و پیگیری خدمات درمانی ورزشکاران کشور است که زیر نظر فدراسیون پزشکی ورزشی فعالیت می‌کند."}, {"id": "shared-23", "title": "بیمه سلامت روستایی", "url": "https://ihio.gov.ir/%D9%85%DB%8C%D8%B2%D8%AE%D8%AF%D9%85%D8%AA-%D8%BA%DB%8C%D8%B1%D8%AD%D8%B6%D9%88%D8%B1%DB%8C", "price": "", "deadline": "", "info": "امانه میز خدمت غیرحضوری بیمه سلامت ایران برای ارائه خدمات الکترونیکی به بیمه‌شدگان طراحی شده تا نیاز به مراجعه حضوری به دفاتر بیمه از بین برود.\r\n\r\nکاربردها:\r\n\r\nاستعلام وضعیت بیمه و مشاهده اطلاعات بیمه‌ای خود یا اعضای خانواده.\r\n\r\nمشاهده نسخه الکترونیکی پزشک، داروخانه، آزمایشگاه یا مرکز درمانی.\r\n\r\nثبت یا تمدید بیمه‌نامه و اضافه کردن اعضای خانوار تحت پوشش.\r\n\r\nجستجو و مشاهده فهرست مراکز درمانی، داروخانه‌ها و پزشکان طرف قرارداد بیمه سلامت.\r\n\r\nدسترسی مراکز درمانی و پزشکان برای ثبت نسخه، خدمات درمانی و تسویه حساب با بیمه.\r\n\r\nنحوه استفاده:\r\n\r\nورود به بخش «میز خدمت غیرحضوری» در سایت سازمان بیمه سلامت.\r\n\r\nانجام ثبت‌نام یا ورود با کد ملی و شماره موبایل.\r\n\r\nانتخاب نوع خدمت موردنظر از منوی اصلی (مثلاً استعلام بیمه، نسخه الکترونیکی یا تمدید بیمه).\r\n\r\nوارد کردن اطلاعات لازم و دریافت نتیجه به‌صورت آنلاین.\r\n\r\nدر پایان امکان چاپ یا ذخیره نتیجه استعلام وجود دارد.\r\n\r\nاین سامانه گامی برای تسهیل دسترسی بیمه‌شدگان به خدمات درمانی، کاهش مراجعات حضوری و افزایش شفافیت اطلاعات بیمه‌ای است."}, {"id": "shared-1", "title": "بیمه کشاورزی", "url": "https://cs.sabka.ir/Login.aspx", "price": "", "deadline": "", "info": "سامانه بیمه کشاورزی سابکا با هدف ارائه خدمات الکترونیکی به کشاورزان، دامداران و بهره‌برداران طراحی شده است و زیر نظر صندوق بیمه کشاورزی فعالیت می‌کند. این سامانه امکان مدیریت بیمه‌نامه‌ها، ثبت خسارت و مشاهده وضعیت بیمه را به‌صورت غیرحضوری فراهم می‌کند.\r\n\r\nکاربردها:\r\n\r\nثبت‌نام کشاورزان و بهره‌برداران برای دریافت پوشش بیمه‌ای محصولات زراعی، باغی، دامی و منابع طبیعی.\r\n\r\nمشاهده و استعلام وضعیت بیمه‌نامه، تاریخ شروع و پایان اعتبار و حق بیمه پرداختی.\r\n\r\nثبت و پیگیری درخواست خسارت بیمه کشاورزی در صورت وقوع حوادثی مثل خشکسالی، تگرگ، سیل یا آتش‌سوزی.\r\n\r\nمشاهده سوابق بیمه‌ای و دریافت گزارش‌های مربوط به خسارت‌های گذشته.\r\n\r\nارتباط آنلاین با کارگزاران بیمه و صندوق بیمه کشاورزی بدون نیاز به مراجعه حضوری.\r\n\r\nنحوه استفاده:\r\n\r\nکاربر وارد سامانه می‌شود و با استفاده از کد ملی یا شناسه بیمه‌نامه وارد حساب کاربری خود می‌گردد.\r\n\r\nاز منوی اصلی می‌تواند گزینه‌هایی مانند «استعلام بیمه‌نامه»، «ثبت خسارت» یا «مشاهده سوابق» را انتخاب کند.\r\n\r\nدر صورت ثبت خسارت، اطلاعات مربوط به نوع حادثه، محل وقوع، محصول آسیب‌دیده و مدارک لازم بارگذاری می‌شود.\r\n\r\nصندوق بیمه کشاورزی پس از بررسی اطلاعات، میزان خسارت را تعیین و نتیجه را در سامانه اعلام می‌کند.\r\n\r\nاین سامانه به هدف شفاف‌سازی خدمات بیمه‌ای، کاهش زمان بررسی خسارت‌ها و حذف مراجعه حضوری کشاورزان ایجاد شده است."}]}, {"id": "category-5", "title": "حمایتی دولت", "desc": "خدمات این دسته", "is_temp": false, "services": [{"id": "shared-870", "title": "ازدواج دانشجویی", "url": "https://hamsafartabehesht.ir/", "price": "", "deadline": "", "info": ""}, {"id": "shared-848", "title": "وام اشتغالزایی جوانان", "url": "https://sso.msy.gov.ir/sso/Login?ReturnUrl=%2FService%2FRouteToService%2F89", "price": "", "deadline": "( مهلت مشخصی اعلام نشده )  اما میتواند 2 الی 3 ماه  مدت داشته باشد", "info": "وام اشتغال‌زایی جوانان ۱۸ تا ۴۰ سال وزارت ورزش و جوانان\r\nمدت بازپرداخت: ۳ سال\r\nمدت تنفس: ۱سال\r\nمیزان سود: ۱۵ درصد"}, {"id": "shared-780", "title": "مستمری جمع", "url": "http://mostameri.mcls.gov.ir/", "price": "", "deadline": "", "info": "🌐راه‌اندازی سامانه ثبت درخواست بهره‌مندی از مستمری جمع\r\n\r\n🔵وزارت تعاون، کار و رفاه اجتماعی، در راستای اجرای قانون «نقل و انتقال سوابق بیمه یا کسور بازنشستگی بین صندوق‌های بازنشستگی و تجمیع سوابق بیمه‌ای اشخاص» و به منظور شفافیت، تسریع در فرایندهای اجرایی و بهره‌مندی عادلانه بیمه‌شدگان از تمامی سوابق بیمه‌ای آنان، سامانه مستمری جمع را راه‌اندازی نموده است.\r\n\r\n🟠متقاضیان می‌توانند با مراجعه به نشانی Mostameri.mcls.gov.ir و با استفاده از راهنمای موجود در سامانه، درخواست خود را ثبت و مراحل رسیدگی به درخواست را پیگیری کنند.\r\n\r\n🏥سازمان تأمین اجتماعی، به درخواست‌های مربوط به سامانه مستمری جمع که توسط وزارت تعاون، کار و رفاه اجتماعی راه‌اندازی شده رسیدگی می‌کند."}, {"id": "shared-590", "title": "سامانه سیمین", "url": "http://simin.hadafmandi.ir/", "price": "", "deadline": "", "info": ""}, {"id": "shared-507", "title": "سامانه کات", "url": "http://kat.mefa.ir/", "price": "", "deadline": "", "info": "سامانه «کات»؛ درگاه واحد تسهیلات اشتغال\r\n\r\nوزارت امور اقتصادی و دارایی سامانه جامع «کات» را به‌عنوان تنها درگاه واحد اعطای تسهیلات اشتغال‌زایی و تولیدی معرفی کرده است. این سامانه با ثبت برخط پرداخت تسهیلات توسط بانک‌ها، ابزار نظارت و جلوگیری از انحراف منابع مالی محسوب می‌شود.\r\n\r\nبه گزارش شادا، سامانه «کات» به نشانی kat.mefa.ir با داشبورد مدیریتی جدید، امکان رصد شفاف درخواست‌ها و پرداخت‌ها را فراهم کرده و این اطلاعات در اختیار نمایندگان مجلس نیز قرار می‌گیرد تا فرآیند اعطای وام‌ها به‌صورت برخط پایش شود. به گفته وزیر اقتصاد، با راه‌اندازی این سامانه قرار است زمان انتظار دریافت وام اشتغال از ۱۲۸ روز به ۴۵ روز کاهش یابد و منابع بانکی بیش از گذشته به سمت تسهیلات خرد و بنگاه‌های کوچک و متوسط هدایت شود."}, {"id": "shared-429", "title": "ثبت ‌نام پنل خورشیدی", "url": "https://www.satba.gov.ir/fa/electronicservicesnew-%D9%85%DB%8C%D8%B2-%D8%AE%D8%AF%D9%85%D8%AA", "price": "", "deadline": "", "info": "بنابر اعلام مجری توسعه نیروگاه‌های خورشیدی توانیر، ثبت ‌نام متقاضیان برای ایجاد نیروگاه خورشیدی پشت ‌بامی از طریق پلتفرم ‌های منتخب آغاز شده و تسهیلات بانکی به واجدان شرایط پرداخت می شود. در این راستا ساتبا با تعدادی از بانک ‌ها به تفاهم رسیده و متقاضیانی که در پلتفرم ‌ها ثبت ‌نام کنند، می ‌توانند برای دریافت تسهیلات نصب نیروگاه خورشیدی معرفی شوند."}, {"id": "shared-419", "title": "ثبت نام وام سربازی", "url": "https://reg.samasoo.ir/Users/Main", "price": "", "deadline": "", "info": ""}, {"id": "shared-330", "title": "زمین فرزند آوری", "url": "https://saman.mrud.ir/", "price": "۲۳۵.۰۰۰", "deadline": "", "info": "بخش درخواست مسکن را انتخاب کنید \r\nسپس از بخش ورود حقیقی وارد وبسایت شوید"}, {"id": "shared-299", "title": "سها", "url": "https://soha.emdad.ir/mis/f?p=900:9999", "price": "", "deadline": "", "info": "وام کمیته امداد"}, {"id": "shared-274", "title": "هوش مصنویی رایگان کودکان", "url": "http://sai.isti.ir/", "price": "", "deadline": "", "info": ""}, {"id": "shared-267", "title": "سامانه حیات", "url": "https://hayat.emdad.ir/mis/emdad/r/990/login", "price": "", "deadline": "", "info": ""}, {"id": "shared-244", "title": "انواع یارانه", "url": "https://www.hadafmandi.ir/fa-IR/Portal/4940/page/%D9%85%DB%8C%D8%B2-%D8%AE%D8%AF%D9%85%D8%AA", "price": "", "deadline": "", "info": ""}, {"id": "shared-205", "title": "خدمات مرزنشینان", "url": "https://marz.taarco.ir/", "price": "", "deadline": "", "info": ""}, {"id": "shared-200", "title": "پویش ملی چکاب ایران", "url": "https://www.drsaina.com/landings/samane-checkup/?utm_source=Telegram-ads&utm_medium=Telegram&utm_campaign=Keshvaritop3&utm_term=040429&utm_content=bank1", "price": "", "deadline": "", "info": ""}, {"id": "shared-188", "title": "سامانه نوین اصناف", "url": "https://novin.iranianasnaf.ir/fa/news/", "price": "۲۸۵.۰۰۰", "deadline": "", "info": ""}, {"id": "shared-106", "title": "ارز مسافرتی", "url": "https://travel.ice.ir/", "price": "۸۰.۰۰۰", "deadline": "", "info": "فرد باید بلیط گرفته باشه همه کاراش تموم مالیات خروج از کشور هم داده باشه بعد می تونه ثبت نام کنه"}, {"id": "shared-65", "title": "بیمه بیکاری", "url": "https://tsk.mcls.gov.ir/Login", "price": "۶۰.۰ یا خروج کالاها و سایر هزینه‌های گمرکی تعیین می‌کند.\r\n\r\nنحوه استفاده:\r\n\r\nشناسه پرداخت یا شناسه قبضی که از گمرک دریافت کرده‌ای را وارد کن.\r\n\r\nمبلغ و مشخصات مربوط به قبض گمرکی نمایش داده می‌شود.\r\n\r\nبا انتخاب گزینه پرداخت، وارد درگاه بانکی می‌شوی.\r\n\r\nپس از پرداخت موفق، رسید رسمی صادر می‌شود که باید برای ارائه به گمرک نگه‌داری شود.\r\n\r\nویژگی‌ها:\r\n\r\nپرداخت سریع و رسمی بدون نیاز به مراجعه حضوری.\r\n\r\nامکان استعلام و پیگیری وضعیت پرداخت.\r\n\r\nامنیت بالا و ارتباط مستقیم با سامانه مرکزی گمرک.\r\n\r\nبه‌طور خلاصه، این سامانه مسیر رسمی و امن برای پرداخت تمام عوارض و هزینه‌های گمرکی کالاها و ترخیصیه‌ها است."}, {"id": "shared-264", "title": "اینتا مدیا", "url": "http://intamedia.ir/", "price": "", "deadline": "", "info": ""}, {"id": "shared-217", "title": "ابلاغیه مالیاتی", "url": "http://my.tax.gov.ir/", "price": "۵۵.۰۰۰", "deadline": "", "info": "بدون چاپ"}, {"id": "shared-202", "title": "عوارض خروج از کشور", "url": "https://sadadpsp.ir/TollPayment/", "price": "", "deadline": "", "info": ""}, {"id": "shared-169", "title": "ثبت و پرداخت فیش", "url": "https://my.tax.gov.ir/", "price": "۴۵.۰۰۰", "deadline": "", "info": "دریافت 15 هزار تومان و پرداخت 30 هزار تومان ( بدون چاپ )"}, {"id": "shared-148", "title": "عوارض سالیانه", "url": "http://cartax.ir/", "price": "۶۰.۰۰۰", "deadline": "", "info": ""}, {"id": "shared-147", "title": "عوارض سالیانه خودرو", "url": "https://portalsaamie.upto.ir/", "price": "", "deadline": "", "info": ""}, {"id": "shared-38", "title": "مالیات بر حقوق", "url": "https://salary.tax.gov.ir/Account/LogOn?ReturnUrl=%2f", "price": "۶۰.۰۰۰", "deadline": "", "info": ""}, {"id": "shared-37", "title": "ثبت نام کد اقتصادی", "url": "https://my.tax.gov.ir/", "price": "تا گام ۴ : ۳۵۰.۰۰۰", "deadline": "", "info": ""}, {"id": "shared-36", "title": "مالیات درامد خودرو", "url": "https://vin.tax.gov.ir:8085/NotaryPublic/Inquiry/", "price": "۵۰.۰۰۰", "deadline": "", "info": ""}, {"id": "shared-35", "title": "مالیات تکلیفی پزشکان", "url": "https                 <span>${srv.title}</span>
                <svg class="ext-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M7 17L17 7M17 7H7M17 7V17"/>
                </svg>
              </a>
              ${(hasDeadline || hasPrice || hasInfo) ? `
                <div class="service-meta">
                  <div class="meta-tags">
                    ${hasDeadline ? `<span class="tag-deadline">${srv.deadline}</span>` : ''}
                    ${hasPrice ? `<span class="tag-price">${srv.price}</span>` : ''}
                  </div>
                  ${hasInfo ? `<button type="button" class="info-btn" data-id="${srv.id}">راهنما</button>` : ''}
                </div>
              ` : ''}
            </article>
          `;
        }).join('');

        sectionsHtml += `
          <section class="section-card ${cat.is_temp ? 'is-temp' : ''}">
            <div class="section-header">
              <div class="section-title-wrap">
                <span class="section-dot"></span>
                <div>
                  <h2>${cat.title}</h2>
                  ${cat.desc ? `<div class="section-desc">${cat.desc}</div>` : ''}
                </div>
              </div>
              <span class="section-badge">${toPersianDigits(filtered.length)} خدمت</span>
            </div>
            <div class="services-grid">
              ${cardsHtml}
            </div>
          </section>
        `;
      });

      visibleCountEl.textContent = toPersianDigits(totalShown);

      if (!sectionsHtml) {
        mainEl.innerHTML = `<div class="empty-state">هیچ خدمتی با عبارت «${searchQuery}» پیدا نشد.</div>`;
      } else {
        mainEl.innerHTML = sectionsHtml;
      }

      // Attach modal listeners
      mainEl.querySelectorAll('.info-btn').forEach(btn => {
        btn.addEventListener('click', () => openServiceModal(btn.dataset.id));
      });
    }

    function openServiceModal(id) {
      for (const cat of PANEL_DATA) {
        const found = cat.services.find(s => s.id === id);
        if (found) {
          modalTitle.textContent = found.title;
          if (found.deadline) {
            modalDeadline.textContent = found.deadline;
            modalDeadline.style.display = 'inline-block';
          } else {
            modalDeadline.style.display = 'none';
          }
          modalBody.textContent = found.info || 'توضیحاتی ثبت نشده است.';
          modalLink.href = found.url;
          modal.classList.add('open');
          break;
        }
      }
    }

    document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modal.classList.remove('open');
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderMain();
    });

    document.getElementById('resetAllBtn').addEventListener('click', (e) => {
      e.preventDefault();
      selectedCategory = 'all';
      searchQuery = '';
      searchInput.value = '';
      activeCatLabel.textContent = 'همه';
      renderSidebar();
      renderMain();
    });

    renderSidebar();
    renderMain();
  </script>
</body>
</html>
