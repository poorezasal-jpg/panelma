<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل خدمات کافی‌نت</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#667085;--brand:#287ce8;--line:#e3e8f2;--chip:#eaf2fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a202c;--text:#e8ecf4;--muted:#9aa4b6;--line:#2a3345;--chip:#1c2a45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a202c;--text:#e8ecf4;--muted:#9aa4b6;--line:#2a3345;--chip:#1c2a45;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;line-height:1.6}
header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
header input{flex:1 1 220px;max-width:360px;padding:8px 12px;border:0;border-radius:10px;font:inherit;background:#fff;color:#1d2433}
.layout{display:grid;grid-template-columns:230px 1fr;gap:16px;padding:16px;max-width:1200px;margin:auto}
nav{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;color:var(--text);font:inherit;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:right}
nav button:hover{background:var(--chip)}
nav button.on{background:var(--brand);color:#fff}
nav small{opacity:.75}
h2{margin:0 0 12px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card a.t{color:var(--text);font-weight:700;text-decoration:none;display:flex;justify-content:space-between;gap:8px}
.card a.t:hover{color:var(--brand)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
.price{background:var(--chip);color:var(--brand);padding:3px 10px;border-radius:20px;font-size:13px}
.info{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
dialog{border:0;border-radius:16px;max-width:440px;width:92%;background:var(--card);color:var(--text);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 8px}
dialog p{white-space:pre-wrap;margin:0 0 14px;color:var(--muted)}
dialog button{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:8px 18px;font:inherit;cursor:pointer}
.empty{color:var(--muted);padding:30px;text-align:center}
@media(max-width:720px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}}
</style>
</head>
<body>
<header><h1>🗂️ پنل خدمات کافی‌نت</h1><input id="q" type="search" placeholder="جستجوی خدمت…"></header>
<div class="layout">
<nav id="nav"></nav>
<main><h2 id="ttl"></h2><div class="grid" id="grid"></div></main>
</div>
<dialog id="dlg"><h3 id="dt"></h3><p id="db"></p><button onclick="dlg.close()">بستن</button></dialog>
<script>
const D=[
["بیمه","سرویس تامین اجتماعی","https://es.tamin.ir/view/index.html","نامشخص","فیش حقوقی بازنشستگان، سابقه بیمه، فیش بیمه اختیاری و مشاغل آزاد."],
["بیمه","فیش بیمه","https://samt.tamin.ir/","نامشخص","دریافت و پرداخت فیش حق بیمه."],
["بیمه","بیمه اداره برق","https://bime.tavanir.org.ir/","نامشخص","ثبت خسارت ناشی از نوسان یا قطع برق."],
["بیمه","استعلام اصالت بیمه‌نامه","https://centinsur.ir/","۲۵.۰۰۰","بررسی معتبر بودن بیمه‌نامه با شماره یا کد یکتا."],
["بیمه","همه سوابق بیمه (مرکزی)","https://centinsur.ir/","۲۵.۰۰۰","استعلام سوابق بیمه‌ای در بیمه مرکزی."],
["بیمه","استعلام بیمه شخص ثالث","https://centinsur.ir/","۲۵.۰۰۰","مشاهده سوابق و وضعیت بیمه شخص ثالث."],
["بیمه","سابقه بیمه","https://account.tamin.ir/auth/login","۴۰.۰۰۰","دریافت سابقه بیمه از تامین اجتماعی."],
["بیمه","انعقاد بیمه","https://account.tamin.ir/auth/login","۱۲۰.۰۰۰","ثبت‌نام بیمه اختیاری یا مشاغل آزاد."],
["بیمه","ثبت‌نام تامین اجتماعی","https://profile.tamin.ir/","۷۵.۰۰۰","ساخت حساب کاربری در سامانه خدمات غیرحضوری."],
["بیمه","پرداخت تامین اجتماعی","https://tamin.sep.ir:1451/","نامشخص","پرداخت اینترنتی حق بیمه و بدهی‌ها."],
["بیمه","نوبت بیمارستان","https://tamin.ir/","۳۰.۰۰۰","نوبت‌دهی مراکز درمانی تامین اجتماعی."],
["بیمه","بیمه ورزشی","https://athlete.ifsm.ir/","۹۰.۰۰۰","ثبت‌نام و خدمات درمانی ورزشکاران."],
["بیمه","بیمه سلامت روستایی","https://ihio.gov.ir/","نامشخص","میز خدمت غیرحضوری بیمه سلامت."],
["بیمه","بیمه کشاورزی","https://cs.sabka.ir/","نامشخص","بیمه‌نامه و ثبت خسارت کشاورزان."],
["استعلامات","ممنوع‌الخروجی","https://my.ssaa.ir/","۲۵.۰۰۰","استعلام وضعیت ممنوع‌الخروجی."],
["استعلامات","کد پستی","https://gnaf.post.ir/","۵۰.۰۰۰","یافتن و بررسی کد پستی ده‌رقمی."],
["استعلامات","صحت چک صیاد","https://cbi.ir/","۳۵.۰۰۰","بررسی اصالت چک صیادی."],
["وام","وام ازدواج","https://ve.cbi.ir/","۱۵۰.۰۰۰","ثبت‌نام وام ازدواج."],
["وام","وام فرزندآوری","https://ve.cbi.ir/","۱۰۰.۰۰۰","ثبت‌نام وام فرزندآوری."],
["وام","وام ودیعه مسکن","https://saman.mrud.ir/","۸۰.۰۰۰","درخواست وام ودیعه مسکن."],
["خودرویی","پرداخت خلافی","https://ghabzino.com/","۳۵.۰۰۰","استعلام و پرداخت خلافی خودرو."],
["خودرویی","ثبت‌نام کارت سوخت","https://fcs.niopdc.ir/","۱۳۰.۰۰۰","درخواست کارت سوخت."]
];
const cats=["همه",...new Set(D.map(x=>x[0]))];
let cur="بیمه";
const $=id=>document.getElementById(id);
function nav(){$("nav").innerHTML=cats.map(c=>{const n=c=="همه"?D.length:D.filter(x=>x[0]==c).length;return `<button class="${c==cur?"on":""}" data-c="${c}">${c}<small>${n}</small></button>`}).join("");
$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=b.dataset.c;$("q").value="";render()})}
function render(){
const q=$("q").value.trim();
let list=D.filter(x=>(cur=="همه"||x[0]==cur)&&(!q||x[1].includes(q)||x[4].includes(q)));
if(q)list=D.filter(x=>x[1].includes(q)||x[4].includes(q));
$("ttl").textContent=q?`نتایج «${q}»`:(cur=="همه"?"همهٔ خدمات":cur);
$("grid").innerHTML=list.length?list.map((x,i)=>`<article class="card"><a class="t" target="_blank" rel="noopener" href="${x[2]}"><span>${x[1]}</span><span>↖</span></a><div class="foot"><span class="price">${x[3]}</span><button class="info" data-i="${D.indexOf(x)}">توضیحات</button></div></article>`).join(""):'<div class="empty">خدمتی پیدا نشد.</div>';
$("grid").querySelectorAll(".info").forEach(b=>b.onclick=()=>{const x=D[b.dataset.i];$("dt").textContent=x[1];$("db").textContent=x[4]+"\n\nدستمزد: "+x[3]+" تومان";dlg.showModal()});
nav()}
$("q").oninput=render;
render();
</script>
</body>
</html>
